name: Build AuraDesk OS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Create Gradle, Manifest & Resource Files
        run: |
          mkdir -p app/src/main/java/com/auradesk/os/{model,theme,system,data,state,ui/components,ui/apps}
          mkdir -p app/src/main/res/{drawable,mipmap-anydpi-v26,values,xml}

          cat <<'EOF_SETTINGS' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AuraDeskOS"
          include(":app")
          EOF_SETTINGS

          cat <<'EOF_GPROPS' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_GPROPS

          cat <<'EOF_ROOT_BUILD' > build.gradle.kts
          plugins {
              id("com.android.application") version "9.4.1" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.10" apply false
          }
          EOF_ROOT_BUILD

          cat <<'EOF_APP_BUILD' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.auradesk.os"
              compileSdk = 37

              defaultConfig {
                  applicationId = "com.auradesk.os"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0.0"
                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              signingConfigs {
                  create("release") {
                      val ks = file("auradesk-release.jks")
                      if (ks.exists()) {
                          storeFile = ks
                          storePassword = System.getenv("AURADESK_KS_PASS") ?: "auradesk123"
                          keyAlias = System.getenv("AURADESK_KEY_ALIAS") ?: "auradesk"
                          keyPassword = System.getenv("AURADESK_KEY_PASS") ?: "auradesk123"
                      }
                  }
              }

              buildTypes {
                  debug {
                      applicationIdSuffix = ".debug"
                      isDebuggable = true
                  }
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                      val rel = signingConfigs.findByName("release")
                      if (rel?.storeFile?.exists() == true) {
                          signingConfig = rel
                      }
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2026.09.00")
              implementation(composeBom)

              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.media3:media3-exoplayer:1.11.1")
              implementation("androidx.media3:media3-ui:1.11.1")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF_APP_BUILD

          cat <<'EOF_PROGUARD' > app/proguard-rules.pro
          -keep class com.auradesk.os.system.AuraNotificationListener { *; }
          -keep class com.auradesk.os.system.ExternalDesktopPresentation { *; }
          -keepattributes SourceFile,LineNumberTable
          EOF_PROGUARD

          cat <<'EOF_MANIFEST' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AuraDeskOS"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:resizeableActivity="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".system.AuraNotificationListener"
                      android:exported="true"
                      android:label="@string/notification_listener_label"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF_MANIFEST

          cat <<'EOF_STRINGS' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">AuraDesk OS</string>
              <string name="notification_listener_label">AuraDesk Notification Center</string>
          </resources>
          EOF_STRINGS

          cat <<'EOF_THEMES' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AuraDeskOS" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowFullscreen">false</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF_THEMES

          cat <<'EOF_PATHS' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <files-path name="workspace" path="." />
              <external-path name="external_files" path="." />
              <cache-path name="cache" path="." />
          </paths>
          EOF_PATHS

          cat <<'EOF_IC_BG' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0E2447" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#184E9E" android:pathData="M0,0L108,0L108,58Q54,88 0,48Z" />
          </vector>
          EOF_IC_BG

          cat <<'EOF_IC_FG' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#62B6FF" android:pathData="M28,28h24v24h-24z" />
              <path android:fillColor="#9AD3FF" android:pathData="M56,28h24v24h-24z" />
              <path android:fillColor="#3A92E6" android:pathData="M28,56h24v24h-24z" />
              <path android:fillColor="#62B6FF" android:pathData="M56,56h24v24h-24z" />
          </vector>
          EOF_IC_FG

          cat <<'EOF_MIPMAP1' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_MIPMAP1

          cat <<'EOF_MIPMAP2' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_MIPMAP2

      - name: Create Core Architecture & System Layer
        run: |
          cat <<'EOF_MODELS' > app/src/main/java/com/auradesk/os/model/DesktopModels.kt
          package com.auradesk.os.model

          import androidx.compose.ui.graphics.Color

          enum class AppType(
              val defaultTitle: String,
              val defaultWidthDp: Float,
              val defaultHeightDp: Float,
              val accentColor: Color
          ) {
              FILE_EXPLORER("File Explorer", 620f, 410f, Color(0xFFF3B234)),
              THIS_PC("This PC", 580f, 390f, Color(0xFF3B9CFF)),
              RECYCLE_BIN("Recycle Bin", 520f, 360f, Color(0xFF7B8FA1)),
              WEB_BROWSER("Aura Browse", 660f, 440f, Color(0xFF1E88E5)),
              TEXT_EDITOR("Notepad Pro", 540f, 380f, Color(0xFF43A047)),
              CALCULATOR("Calculator", 330f, 450f, Color(0xFF00ACC1)),
              SETTINGS("Settings", 610f, 420f, Color(0xFF5C6BC0)),
              IMAGE_VIEWER("Photo Viewer", 540f, 400f, Color(0xFFAB47BC)),
              VIDEO_PLAYER("Media Cinema", 580f, 400f, Color(0xFFE53935)),
              MUSIC_PLAYER("Aura Music", 480f, 390f, Color(0xFFEC407A)),
              TERMINAL("Aura Terminal", 560f, 360f, Color(0xFF26A69A)),
              TASK_MANAGER("Task Manager", 560f, 380f, Color(0xFFEF6C00)),
              DOWNLOADS("Downloads", 560f, 370f, Color(0xFF29B6F6)),
              GALLERY("Gallery", 600f, 420f, Color(0xFF8E24AA)),
              APP_LAUNCHER("Android Apps", 600f, 430f, Color(0xFF4CAF50))
          }

          enum class TaskbarPosition { BOTTOM, TOP }
          enum class IconSizePreset(val boxDp: Float, val iconDp: Float, val labelSp: Float) {
              SMALL(68f, 30f, 10.5f),
              MEDIUM(82f, 38f, 11.5f),
              LARGE(96f, 46f, 12.5f)
          }

          enum class WallpaperPreset(val title: String) {
              BLOOM_BLUE("Aura Bloom"),
              AURORA_NIGHT("Aurora Night"),
              SUNSET_SILK("Sunset Silk"),
              EMERALD_GLASS("Emerald Glass"),
              CUSTOM_IMAGE("Custom Image")
          }

          data class PersonalizationConfig(
              val isDarkMode: Boolean = true,
              val wallpaper: WallpaperPreset = WallpaperPreset.BLOOM_BLUE,
              val customWallpaperPath: String? = null,
              val accentHex: Long = 0xFF2B88D8L,
              val taskbarPosition: TaskbarPosition = TaskbarPosition.BOTTOM,
              val iconSize: IconSizePreset = IconSizePreset.MEDIUM,
              val uiScale: Float = 1.0f,
              val windowCornerDp: Float = 14f,
              val acrylicAlpha: Float = 0.86f,
              val userName: String = "Aura User",
              val immersiveFullscreen: Boolean = true
          )

          data class DesktopWindow(
              val id: String,
              val appType: AppType,
              val title: String,
              val xDp: Float,
              val yDp: Float,
              val widthDp: Float,
              val heightDp: Float,
              val zIndex: Int,
              val desktopId: Int,
              val isMinimized: Boolean = false,
              val isMaximized: Boolean = false,
              val payloadPath: String? = null
          )

          data class DesktopIconItem(
              val id: String,
              val title: String,
              val appType: AppType? = null,
              val packageName: String? = null,
              val targetPath: String? = null,
              val xDp: Float,
              val yDp: Float
          )

          data class VirtualDesktop(val id: Int, val name: String)
          data class RecentFileItem(val name: String, val path: String, val timestampMs: Long)
          data class OsNotification(val id: String, val title: String, val body: String, val source: String, val timestampMs: Long)

          data class FileEntry(
              val name: String,
              val path: String,
              val isDirectory: Boolean,
              val sizeBytes: Long,
              val lastModifiedMs: Long,
              val extension: String,
              val contentUri: String? = null
          )

          data class RecycleItem(
              val id: String,
              val originalName: String,
              val originalPath: String,
              val storedPath: String,
              val deletedAtMs: Long,
              val sizeBytes: Long,
              val isDirectory: Boolean
          )

          data class InstalledAppInfo(val label: String, val packageName: String)

          data class DownloadTaskItem(
              val id: String,
              val fileName: String,
              val url: String,
              val progress: Float,
              val status: String,
              val outputPath: String? = null
          )

          data class SystemTelemetry(
              val batteryPercent: Int = 100,
              val isCharging: Boolean = false,
              val wifiConnected: Boolean = false,
              val wifiLabel: String = "Offline",
              val usedRamMb: Long = 0,
              val totalRamMb: Long = 0,
              val freeStorageBytes: Long = 0,
              val totalStorageBytes: Long = 0,
              val externalDisplayCount: Int = 0,
              val volumePercent: Int = 60
          )
          EOF_MODELS

          cat <<'EOF_THEME' > app/src/main/java/com/auradesk/os/theme/AuraTheme.kt
          package com.auradesk.os.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.runtime.staticCompositionLocalOf
          import androidx.compose.ui.graphics.Color
          import com.auradesk.os.model.PersonalizationConfig

          data class AuraPalette(
              val isDark: Boolean,
              val accent: Color,
              val windowSurface: Color,
              val titleBarSurface: Color,
              val panelSurface: Color,
              val taskbarSurface: Color,
              val borderSubtle: Color,
              val textPrimary: Color,
              val textSecondary: Color,
              val cardSurface: Color
          )

          val LocalAuraPalette = staticCompositionLocalOf {
              AuraPalette(
                  isDark = true,
                  accent = Color(0xFF2B88D8),
                  windowSurface = Color(0xE81C212B),
                  titleBarSurface = Color(0xF2161B24),
                  panelSurface = Color(0xEC1A202B),
                  taskbarSurface = Color(0xE011161F),
                  borderSubtle = Color(0x33FFFFFF),
                  textPrimary = Color(0xFFF3F6FC),
                  textSecondary = Color(0xFFAAB4C4),
                  cardSurface = Color(0x22FFFFFF)
              )
          }

          @Composable
          fun AuraDeskTheme(config: PersonalizationConfig, content: @Composable () -> Unit) {
              val accent = Color(config.accentHex)
              val alpha = config.acrylicAlpha.coerceIn(0.65f, 0.98f)
              val palette = if (config.isDarkMode) {
                  AuraPalette(
                      isDark = true,
                      accent = accent,
                      windowSurface = Color(0xFF1C212B).copy(alpha = alpha),
                      titleBarSurface = Color(0xFF141922).copy(alpha = (alpha + 0
